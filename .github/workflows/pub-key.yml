name: publish GPG public key

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Import GPG private key
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
          echo "No GPG private key provided, skipping import."
          exit 0
        fi
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Export GPG public key
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(gpg --batch --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1 == "fpr" { print $10; exit }' || true)"
        if [[ -z "$fingerprint" ]]; then
          echo "No GPG secret key found, skipping export."
          exit 0
        fi
        gpg --batch --armor --export "$fingerprint" > v2rayN-public-key.asc

    - name: Check public key exists
      id: check-pub
      shell: bash
      run: |
        if [[ -f v2rayN-public-key.asc ]]; then
          echo "has_pub=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_pub=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload GPG public key to release
      if: steps.check-pub.outputs.has_pub == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        file: v2rayN-public-key.asc
        tag: ${{ inputs.release_tag }}
        prerelease: true
        overwrite: true
